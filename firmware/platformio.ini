; chronoshift panel firmware — see SPEC.md
; Primary target: LilyGO T5 2.13" V2.3.1. Alternate: generic ESP32 + SPI e-ink
; (same env; change the pin block and driver class in src/main.cpp).

[platformio]
default_envs = t5

[env:t5]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.6.0
build_flags =
    -Wall
    -I include
